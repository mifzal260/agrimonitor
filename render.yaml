services:
  - type: web
    name: agrimonitor-backend
    env: python
    rootDir: agrimonitor_backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: PREPARE_DATABASE_ON_STARTUP
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://agrimonitor-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14
      - key: REFRESH_TOKEN_ROTATION_ENABLED
        value: true
      - key: REFRESH_TOKEN_REUSE_DETECTION_ENABLED
        value: true
      - key: MAX_ACTIVE_SESSIONS_PER_USER
        value: 10
      - key: SESSION_CLEANUP_BATCH_SIZE
        value: 500
      - key: ALLOW_LEGACY_ACCESS_TOKENS
        value: true
      - key: REGISTRATION_RATE_LIMIT_ENABLED
        value: true
      - key: REGISTRATION_MAX_ATTEMPTS_PER_EMAIL
        value: 5
      - key: REGISTRATION_EMAIL_WINDOW_SECONDS
        value: 1800
      - key: REGISTRATION_MAX_ATTEMPTS_PER_IP
        value: 10
      - key: REGISTRATION_IP_WINDOW_SECONDS
        value: 3600
      - key: LOGIN_PROTECTION_STORE
        value: memory
      - key: LOGIN_PROTECTION_FAIL_MODE
        value: closed
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: agrimonitor:login-protection
      - key: REDIS_SOCKET_TIMEOUT_SECONDS
        value: 2
      - key: REDIS_CONNECT_TIMEOUT_SECONDS
        value: 2
      - key: REDIS_HEALTH_CHECK_INTERVAL_SECONDS
        value: 30
      - key: REDIS_MAX_CONNECTIONS
        value: 20
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: beam

  - type: web
    name: agrimonitor-frontend
    env: static
    rootDir: agrimonitor_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
